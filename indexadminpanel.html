<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style id="gsh-brand-css">
/* ---- Global Social Hub brand kit: logo + page-transition loader (shared, single source) ---- */
.gsh-logo{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.gsh-mark{display:block;flex:none;width:auto;user-select:none;-webkit-user-drag:none}
.gshl{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(120% 90% at 50% 36%,#fff 0%,var(--bg,#faf8ff) 58%,var(--p50,#f6f3ff) 100%);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s;outline:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:contain;touch-action:none}
.gshl.on{opacity:1;visibility:visible;transition:opacity .25s ease}
.gshl-box{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3.6vh,26px);max-width:100%;text-align:center;transform:translateY(8px) scale(.98);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.gshl.on .gshl-box{transform:none}
.gshl-ring{--s:clamp(112px,min(46vw,34vh),180px);position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;flex:none}
.gshl-glow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.15),rgba(124,58,237,0) 70%);animation:gshl-breathe 2.6s ease-in-out infinite}
.gshl-arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:gshl-rot 1.7s linear infinite}
.gshl-arc.rev{inset:7%;width:86%;height:86%;animation:gshl-rot 2.9s linear infinite reverse}
.gshl-track{fill:none;stroke:var(--p100,#ede8ff);stroke-width:2.6}
.gshl-spin{fill:none;stroke:url(#gshl-g);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:60 229;animation:gshl-dash 2.2s ease-in-out infinite}
.gshl-spin2{fill:none;stroke:var(--p300,#c3b2fc);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:34 211}
.gshl-logo{position:relative;width:70%;height:auto;animation:gshl-pulse 2.6s ease-in-out infinite;user-select:none;-webkit-user-drag:none}
.gshl-msg{margin:0;min-height:1.5em;font-weight:600;font-size:clamp(14px,3.7vw,16px);letter-spacing:.01em;color:var(--ink2,#484263);animation:gshl-fade 1.9s ease-in-out infinite}
.gshl.net .gshl-arc{animation-duration:3.4s}
.gshl.net .gshl-msg{color:var(--ink,#1b1533)}
html.gshl-lock{overflow:hidden}
@keyframes gshl-rot{to{transform:rotate(360deg)}}
@keyframes gshl-dash{0%,100%{stroke-dasharray:24 265}50%{stroke-dasharray:150 139}}
@keyframes gshl-breathe{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes gshl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes gshl-fade{0%,100%{opacity:.62}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.gshl .gshl-arc,.gshl .gshl-spin,.gshl .gshl-glow,.gshl .gshl-logo,.gshl .gshl-msg{animation:none!important}.gshl .gshl-spin{stroke-dasharray:110 179}}
@media print{.gshl{display:none!important}}
</style>

  };
  const CFG = {
    presets: {
      login: { minMs: 3000, maxMs: 5000, delayMs: 0 },       // after sign-in: brief brand moment, released as soon as the destination is ready
      boot: { minMs: 0, maxMs: 8000, delayMs: 350 }          // first load: only appears if loading is not instant
    },
    probeAfterMs: 2000, probeEveryMs: 2500, probeTimeoutMs: 4000, hardMaxMs: 60000
  };

  /* ---- logo helpers ---- */
  const fullImg = (w, alt = NAME) => `<img class="gsh-logo" src="${ASSET.full.src}" width="${w}" height="${Math.round(w * ASSET.full.h / ASSET.full.w)}" alt="${alt}" decoding="async" draggable="false">`;
  const markImg = h => `<img class="gsh-mark" src="${ASSET.mark.src}" width="${Math.round(h * ASSET.mark.w / ASSET.mark.h)}" height="${h}" alt="" aria-hidden="true" decoding="async" draggable="false">`;

  /* ---- favicon + app icon (replaces any previous icon links) ---- */
  (() => {
    const head = document.head;
    head.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(n => n.remove());
    const add = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; Object.assign(l, extra || {}); head.appendChild(l); };
    add('icon', ASSET.icon, { type: 'image/png', sizes: '64x64' });
    add('apple-touch-icon', ASSET.touch, { sizes: '180x180' });
  })();

  /* ---- page-transition loader ---- */
  const loader = (() => {
    let el = null, msgEl = null, S = null, timer = null, showTimer = null, probeFn = null, prevFocus = null;
    const online = () => navigator.onLine !== false;
    const trap = e => { if (e.key === 'Tab') e.preventDefault(); };

    function build() {
      if (el) return;
      el = document.createElement('div');
      el.className = 'gshl'; el.tabIndex = -1;
      el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); el.setAttribute('aria-hidden', 'true');
      el.innerHTML = `<div class="gshl-box"><div class="gshl-ring"><span class="gshl-glow"></span>
        <svg class="gshl-arc" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="gshl-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3b2fc"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><circle class="gshl-track" cx="50" cy="50" r="46"/><circle class="gshl-spin" cx="50" cy="50" r="46"/></svg>
        <svg class="gshl-arc rev" viewBox="0 0 100 100" aria-hidden="true"><circle class="gshl-spin2" cx="50" cy="50" r="46"/></svg>
        <img class="gshl-logo" src="${ASSET.full.src}" alt="${NAME}" draggable="false"></div><p class="gshl-msg">Please wait...</p></div>`;
      msgEl = el.querySelector('.gshl-msg');
      document.body.appendChild(el);
    }
    function reveal() {
      if (!S || S.shown) return;
      S.shown = true; prevFocus = document.activeElement;
      el.classList.add('on'); el.setAttribute('aria-hidden', 'false');
      document.documentElement.classList.add('gshl-lock');
      document.addEventListener('keydown', trap, true);
      try { el.focus({ preventScroll: true }); } catch (_) {}
    }
    function conceal() {
      el.classList.remove('on'); el.classList.remove('net'); el.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('gshl-lock');
      document.removeEventListener('keydown', trap, true);
      if (prevFocus && prevFocus !== document.body && document.contains(prevFocus)) { try { prevFocus.focus({ preventScroll: true }); } catch (_) {} }
      prevFocus = null;
    }
    function setNet(v) {
      if (!S || S.net === v) return;
      S.net = v; el.classList.toggle('net', v);
      msgEl.textContent = v ? 'Waiting for internet connection' : 'Please wait...';
    }
    function finish() {
      clearInterval(timer); clearTimeout(showTimer); timer = showTimer = null;
      const wasShown = S && S.shown; S = null;
      if (el && wasShown) conceal();
    }
    // Is the backend reachable right now? (The probe is supplied by the app; without one we rely on the browser's online state.)
    async function reachable() {
      if (!online()) return false;
      if (!probeFn) return true;
      try { return !!(await Promise.race([probeFn(), new Promise(r => setTimeout(() => r(false), CFG.probeTimeoutMs))])); } catch (_) { return false; }
    }
    async function probe() {
      const s = S; if (!s || s.probing) return;
      s.probing = true; s.lastProbe = Date.now();
      const good = await reachable();
      s.probing = false;
      if (S !== s) return;
      setNet(!good); tick();
    }
    function tick() {
      if (!S) return;
      const now = Date.now(), t = now - S.t0;
      if (!online()) setNet(true);
      else if (!S.probing && now - S.lastProbe >= CFG.probeEveryMs && ((!S.ready && t >= CFG.probeAfterMs) || S.net)) probe();
      if (t >= CFG.hardMaxMs) { finish(); return; }     // never block forever; the app's own error/empty states take over
      if (S.net) return;                                  // no connection: wait, then continue automatically
      if (S.ready && t >= S.minMs) finish();              // destination is ready and the brand moment has elapsed
      else if (t >= S.maxMs) finish();                    // connected but slow: don't hold the person up
    }
    /* begin('login' | 'boot' | { minMs, maxMs, delayMs }) — show the loader for a page transition. */
    function begin(opt) {
      const o = Object.assign({}, typeof opt === 'string' ? CFG.presets[opt] : opt);
      build();
      if (S) { S.minMs = Math.max(S.minMs, o.minMs || 0); S.maxMs = Math.max(S.maxMs, o.maxMs || 0); if (!o.delayMs) reveal(); return; }   // one loader at a time
      S = { t0: Date.now(), minMs: o.minMs || 0, maxMs: o.maxMs || CFG.presets.login.maxMs, ready: false, net: false, shown: false, probing: false, lastProbe: 0 };
      msgEl.textContent = 'Please wait...'; el.classList.remove('net');
      if (o.delayMs) showTimer = setTimeout(reveal, o.delayMs); else reveal();
      timer = setInterval(tick, 200);
    }
    const ready = () => { if (S) { S.ready = true; tick(); } };          // the destination has rendered
    const cancel = () => { if (S) finish(); };
    const wait = ms => new Promise(res => {
      const done = () => { clearTimeout(t); window.removeEventListener('online', done); res(); };
      const t = setTimeout(done, ms); window.addEventListener('online', done, { once: true });
    });
    /* After a failed request: if it was a connectivity problem, keep the loader up ("Waiting for internet connection")
       and resolve true once the connection is back; resolve false if it wasn't a connection problem or the wait gave up. */
    async function recover() {
      if (!S || await reachable()) return false;
      setNet(true);
      while (S) { await wait(CFG.probeEveryMs); if (S && await reachable()) { setNet(false); return true; } }
      return false;
    }
    window.addEventListener('offline', () => { if (S) setNet(true); });
    window.addEventListener('online', () => { if (S) probe(); });
    return { begin, ready, cancel, recover, setProbe: f => { probeFn = f; }, active: () => !!S, waitingForNetwork: () => !!(S && S.net), config: CFG };
  })();

  return { name: NAME, assets: ASSET, fullImg, markImg, loader };
})();

<title>Global Social Hub Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --p50:#f6f3ff;--p100:#ede8ff;--p200:#ddd3fe;--p300:#c3b2fc;--p400:#a78bfa;--p500:#8b5cf6;--p600:#7c3aed;--p700:#6d28d9;--p800:#5b21b6;--p900:#3b1a78;
  --ink:#1b1533;--ink2:#484263;--muted:#7b7594;--line:#e9e5f5;--bg:#faf8ff;--card:#fff;
  --ok:#047857;--okbg:#d9f7e8;--warn:#a15c07;--warnbg:#fdf0cf;--err:#c62828;--errbg:#fde3e3;--info:#3651d4;--infobg:#e3e9ff;
  --r:12px;--r-sm:8px;--sh:0 1px 2px rgba(59,26,120,.05),0 6px 18px rgba(59,26,120,.05);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100%}
body.no-scroll{overflow:hidden}
a{color:var(--p700);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1{font-size:20px;line-height:1.25;letter-spacing:-.01em;font-weight:700}
h2{font-size:16px;line-height:1.3;font-weight:700;letter-spacing:-.005em}
h3{font-size:14px;line-height:1.35;font-weight:650}
small,.small{font-size:12px}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
:focus-visible{outline:2px solid var(--p500);outline-offset:2px;border-radius:6px}
.ic{flex:none;vertical-align:middle}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;white-space:nowrap;text-decoration:none!important}
.btn:disabled,.btn.busy{opacity:.6;pointer-events:none}
.btn-primary{background:var(--p700);color:#fff}
.btn-primary:hover{background:var(--p800)}
.btn-outline{border-color:var(--line);background:#fff;color:var(--ink)}
.btn-outline:hover{border-color:var(--p300);background:var(--p50)}
.btn-soft{background:var(--p100);color:var(--p800)}
.btn-soft:hover{background:var(--p200)}
.btn-ghost{color:var(--ink2)}
.btn-ghost:hover{background:var(--p50)}
.btn-danger{background:var(--err);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-danger-soft{background:var(--errbg);color:var(--err)}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--r-sm);color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--p50);color:var(--p700)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Live exchange rate to NGN: fetched from public rate APIs and cached, never hardcoded ---------- */
const FX = (() => {
  const TTL = 60 * 60 * 1000, MAX_AGE = 24 * 60 * 60 * 1000, RETRY = 30 * 1000, PFX = 'gs-fx-';

  const entry = b => mem[b] || (mem[b] = stored(b));

    { url: 'https://open.er-api.com/v6/latest/' + b, pick: j => (j && j.result === 'success' && j.rates ? j.rates.NGN : null) },
    { url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/' + l + '.json', pick: j => (j && j[l] ? j[l].ngn : null) }
  ]; };
  async function getJson(url) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null, t = setTimeout(() => ctl && ctl.abort(), 7000);
    try { const r = await fetch(url, ctl ? { signal: ctl.signal } : {}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }

    for (const s of sources(b)) { try { const rate = Number(s.pick(await getJson(s.url))); if (good(rate)) return rate; } catch (_) {} }
    return null;
  }
  // Latest known rate (1 unit of `base` in NGN), or null. A cached rate is used while a refresh runs, but never one older than a day.
  function get(base) { const b = code(base); if (!b) return null; const e = entry(b); return e && Date.now() - e.at < MAX_AGE ? e.rate : null; }

      if (!rate) { failedAt[b] = Date.now(); return; }

      try { localStorage.setItem(PFX + b, JSON.stringify(mem[b])); } catch (_) {}

})();

function toggleUsdtFields() {

    try { await GS.deletePlatform(p.id); toast('Platform deleted'); render(); } catch (e) { toast(e.message, 'err'); }
  },

    try { await GS.deleteCategory(c.id); toast('Category deleted'); render(); } catch (e) { toast(e.message, 'err'); }
  },

    try { await GS.setUserStatus(u.id, to); toast(to === 'suspended' ? 'Account suspended' : 'Account reactivated'); render(); userModal(u.id); } catch (e) { toast(e.message, 'err'); }

  'open-deposit': el => depositModal(el.dataset.id),
  'zoom-proof': el => { const x = findIn('deposits', el.dataset.id); modal({ title: 'Payment proof', size: 'lg', body: `<img src="${x.proof}" alt="Payment proof" style="max-width:100%;margin:0 auto;border-radius:8px">` }); },
  'dep-process': async el => {
    try { await GS.markProcessing(el.dataset.id); toast('Marked as processing'); render(); depositModal(el.dataset.id); }
    catch (e) { toast(e.message, 'err'); }
  },

    try { await approveDeposit(x.id); toast('Deposit approved and wallet credited'); closeModal(); render(); } catch (e) { toast(e.message, 'err'); closeModal(); render(); }
  },

  'add-method': () => methodForm(), 'edit-method': el => methodForm(el.dataset.id),
  'del-method': async el => { const m = findIn('paymentMethods', el.dataset.id); if (!await confirmDlg({ title: 'Delete payment method?', message: `<b>${esc(m.name)}</b> will be removed. Past deposits keep their records.`, confirmText: 'Delete', danger: true })) return; try { await GS.deleteRow('paymentMethods', m.id); toast('Payment method deleted'); render(); } catch (e) { toast(e.message, 'err'); } },
  'add-contact': () => contactForm(), 'edit-contact': el => contactForm(el.dataset.id),
  'del-contact': async el => { const c = findIn('contacts', el.dataset.id); if (!await confirmDlg({ title: 'Delete contact?', message: `<b>${esc(c.label || c.value)}</b> will be removed from the storefront.`, confirmText: 'Delete', danger: true })) return; try { await GS.deleteRow('contacts', c.id); toast('Contact deleted'); render(); } catch (e) { toast(e.message, 'err'); } },
  'del-ntf': async el => { try { await GS.deleteNotification(el.dataset.id); render(); } catch (e) { toast(e.message, 'err'); } },
  'revoke-invite': async el => {

  },
  'export-data': async () => {

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(err.message || 'Something went wrong.', 'err'); }); }
  catch (err) { console.error(err); toast(err.message || 'Something went wrong.', 'err'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'svgSrc' || (e.target.name === 'name' && e.target.form && e.target.form.dataset.form === 'platform')) { svgPreview(); return; }
  if (e.target.id === 'mf-name') { toggleUsdtFields(); return; }
  const el = e.target.closest('[data-flt]'); if (!el || el.tagName === 'SELECT') return;
  const [s, k] = el.dataset.flt.split('.'); A.f[s][k] = el.value; $('#list').innerHTML = LISTS[s]();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.matches('[data-toggle]')) {
    try { await GS.toggleEnabled(el.dataset.toggle, el.dataset.id, el.checked); toast(el.checked ? 'Enabled' : 'Disabled', 'info'); render(); }
    catch (err) { el.checked = !el.checked; toast(err.message, 'err'); }
    return;
  }
  if (el.matches('select[data-flt]')) {
    const [s, k] = el.dataset.flt.split('.'); A.f[s][k] = el.value;
    if (s === 'inventory' && k === 'platform') A.f.inventory.category = '';
    if (s === 'inventory' && k === 'platform') render(); else $('#list').innerHTML = LISTS[s]();
    return;
  }
  if (el.id === 'lf-p') { $('#lf-c').innerHTML = catOptionsFor(el.value); return; }
  try {
    if (el.id === 'svgFile' && el.files[0]) { const t = await readText(el.files[0]); $('#svgSrc').value = t; svgPreview(); }
    if (el.id === 'imgFile' && el.files[0]) { A.img = await readImage(el.files[0], 800, .7); $('#imgPrev').innerHTML = `<img src="${A.img}" alt="">`; }
    if (el.id === 'importFile' && el.files[0]) {
      const obj = JSON.parse(await readText(el.files[0]));
      if (!obj || !Array.isArray(obj.platforms) || !Array.isArray(obj.listings)) throw new Error('That file is not a Global Social Hub backup.');
      if (!await confirmDlg({ title: 'Import catalog backup?', message: 'This replaces platforms, categories, listings, payment methods and contacts with the ones in this file. Users, wallets, orders, transactions and deposits are not affected.', confirmText: 'Import and replace', danger: true })) { el.value = ''; return; }
      await GS.importCatalogBackup(obj); toast('Backup imported'); render(); el.value = '';
    }
  } catch (err) { toast(err.message || 'Could not read that file.', 'err'); }
});

/* ---------- forms ---------- */
const withMsg = (f, fn) => async () => {
  const box = $('.msg', f), btn = submitBtn(f); if (box) box.innerHTML = ''; busy(btn, true, 'Saving');
  try { await fn(); } catch (err) { if (box) box.innerHTML = formErr(err.message); busy(btn, false); const m = $('.modal-body'); if (m) m.scrollTo({ top: 0, behavior: 'smooth' }); }
};
const forms = {
  setup: f => withMsg(f, async () => {
    const v = fd(f), email = v.email.trim().toLowerCase();
    if (v.name.trim().length < 2) throw new Error('Enter your name.');
    if (!validEmail(email)) throw new Error('Enter a valid email address.');
    if (v.password.length < 8) throw new Error('Password must be at least 8 characters.');
    if (v.password !== v.confirm) throw new Error('Passwords do not match.');
    await GS.setupFirstAdmin({ name: v.name.trim(), email, password: v.password });
    toast('Admin account created. Please log in to continue.'); A.authMode = 'login'; render();
  })(),
  login: f => withMsg(f, async () => {
    const v = fd(f), email = v.email.trim().toLowerCase();
    await GS.login(email, v.password);
    GSH.loader.begin('login'); toast('Welcome back'); location.hash = '#/dashboard'; render(); GSH.loader.ready();   // ready: the dashboard has rendered
  })(),
  'admin-register': f => withMsg(f, async () => {
    const v = fd(f), email = v.email.trim().toLowerCase();
    if (v.name.trim().length < 2) throw new Error('Enter your full name.');
    if (!validEmail(email)) throw new Error('Enter a valid email address.');
    if (v.password.length < 8) throw new Error('Password must be at least 8 characters.');
    if (v.password !== v.confirm) throw new Error('Passwords do not match.');
    await GS.registerAdmin({ name: v.name.trim(), email, password: v.password });
    toast('Admin account created. Please log in to continue.'); A.authMode = 'login'; render();
  })(),
  platform: f => withMsg(f, async () => {
    const v = fd(f), name = v.name.trim(); if (!name) throw new Error('Enter a platform name.');
    let icon = ''; if (v.icon.trim()) { icon = cleanSvg(v.icon); if (!icon) throw new Error('That SVG could not be read. Paste valid SVG markup.'); }
    if (D().platforms.some(p => p.id !== v.id && p.name.toLowerCase() === name.toLowerCase())) throw new Error('A platform with this name already exists.');
    await GS.saveRow('platforms', v.id || null, { name, description: v.description.trim(), icon, enabled: !!v.enabled });
    closeModal(); toast('Platform saved'); render();
  })(),
  category: f => withMsg(f, async () => {
    const v = fd(f), name = v.name.trim(); if (!name) throw new Error('Enter a category name.'); if (!v.platformId) throw new Error('Choose a platform.');
    if (!D().platforms.some(p => p.id === v.platformId)) throw new Error('That platform no longer exists.');
    if (D().categories.some(c => c.id !== v.id && c.platformId === v.platformId && c.name.toLowerCase() === name.toLowerCase())) throw new Error('This platform already has a category with that name.');
    await GS.saveRow('categories', v.id || null, { platform_id: v.platformId, name, description: v.description.trim(), enabled: !!v.enabled });
    closeModal(); toast('Category saved'); render();
  })(),
  listing: f => withMsg(f, async () => {
    const v = fd(f), name = v.name.trim(), price = num(v.price);
    if (!name) throw new Error('Enter a listing name.');
    if (!v.platformId || !v.categoryId) throw new Error('Choose a platform and a category.');
    if (price == null || price < 0) throw new Error('Enter a valid price.');
    if (!v.authorized) throw new Error('Confirm that this account is authorized for transfer.');
    let stock = parseInt(v.stock, 10); if (!Number.isFinite(stock) || stock < 0) stock = 0;
    let status = v.status;
    if (stock <= 0 && status === 'available') status = 'sold';
    const rows = cls => $$('.' + cls, f).map(r => ({ label: $('[data-k=l]', r).value.trim(), value: $('[data-k=v]', r).value.trim() })).filter(x => x.label && x.value);
    const attributes = rows('attr-row'), deliveryData = rows('deliv-row');
    const hidden = ['country', 'age', 'followers', 'following', 'posts', 'niche'].filter(k => !v['show_' + k]);
    await GS.saveListing({
      id: v.id || null, platformId: v.platformId, categoryId: v.categoryId, name, price, stock, status,
      country: v.country.trim(), ageMonths: num(v.ageMonths), followers: num(v.followers), following: num(v.following), posts: num(v.posts),
      niche: v.niche.trim(), description: v.description.trim(), image: A.img || null, hidden, attributes, deliveryData, note: v.note.trim()
    });
    closeModal(); toast('Listing saved'); render();
  })(),
  'order-status': f => withMsg(f, async () => {
    const v = fd(f), o = D().orders.find(x => x.id === v.id); if (!o) throw new Error('Order not found.');
    const note = v.note.trim(), same = o.status === v.status;
    if (same && !note) throw new Error('Choose a different status or add a note.');
    if (same) await GS.addOrderNote(v.id, note); else await GS.updateOrderStatus(v.id, v.status, note);
    toast(same ? 'Note sent to customer' : 'Order updated'); render(); orderModal(v.id);
  })(),
  reject: f => withMsg(f, async () => {
    const v = fd(f), reason = v.reason.trim(); if (!reason) throw new Error('Enter a reason so the customer knows what to fix.');
    await GS.rejectDeposit(v.id, reason);
    closeModal(); toast('Deposit rejected'); render();
  })(),
  method: f => withMsg(f, async () => {
    const v = fd(f); if (!v.name.trim()) throw new Error('Enter a name for this payment method.');
    const isUsdt = v.name.trim().toUpperCase() === 'USDT DEPOSIT';
    if (isUsdt) {
      if (!v.provider.trim()) throw new Error('Enter the network (e.g. TRC20).');
      if (!v.accountNumber.trim()) throw new Error('Enter the USDT wallet address.');
    }
    await GS.saveRow('paymentMethods', v.id || null, { name: v.name.trim(), type: isUsdt ? 'usdt' : 'bank', provider: v.provider.trim(), account_name: v.accountName.trim(), account_number: v.accountNumber.trim(), instructions: v.instructions.trim(), contact_info: v.contactInfo.trim(), enabled: !!v.enabled });
    closeModal(); toast('Payment method saved'); render();
  })(),
  contact: f => withMsg(f, async () => {
    const v = fd(f); if (!v.value.trim()) throw new Error('Enter the contact value.');
    await GS.saveRow('contacts', v.id || null, { type: v.type, label: v.label.trim(), value: v.value.trim(), enabled: !!v.enabled });
    closeModal(); toast('Contact saved'); render();
  })(),
  message: f => withMsg(f, async () => {
    const v = fd(f); if (!v.title.trim() || !v.message.trim()) throw new Error('Enter a title and a message.');
    await GS.sendNotification({ userId: v.audience === 'all' ? null : v.audience, title: v.title.trim(), message: v.message.trim() });
    toast('Message sent'); render();
  })(),
  'invite-admin': f => withMsg(f, async () => {
    const v = fd(f), email = v.email.trim().toLowerCase();
    if (!validEmail(email)) throw new Error('Enter a valid email address.');
    await GS.inviteAdmin(email);
    toast('Invite sent — they can now register at ' + email); f.reset(); render();
  })(),
  settings: f => withMsg(f, async () => {
    const v = fd(f), min = num(v.minDeposit); if (min == null || min < 0) throw new Error('Enter a valid minimum deposit.');
    await GS.saveSettings({ currencySymbol: v.currencySymbol.trim(), currencyCode: v.currencyCode.trim(), minDeposit: min, tagline: v.tagline.trim() });
    toast('Settings saved'); render();
  })(),
  'admin-password': f => withMsg(f, async () => {
    const v = fd(f);
    if (v.password.length < 8) throw new Error('New password must be at least 8 characters.');
    if (v.password !== v.confirm) throw new Error('New passwords do not match.');
    await GS.changeAdminPassword(v.current, v.password);
    toast('Password updated'); f.reset(); busy(submitBtn(f), false);
  })(),
  reset: f => withMsg(f, async () => {
    if (fd(f).confirm.trim() !== 'RESET') throw new Error('Type RESET exactly to confirm.');
    await GS.resetCatalog(); closeModal(); toast('Catalog data reset'); render();
  })()
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const h = forms[f.dataset.form]; if (h) h(f, e);
});

/* ---------- boot ---------- */
window.addEventListener('hashchange', navigate);
GS.onExternalChange(() => {
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if ($('.modal-backdrop') || typing) return;
  if ($('.auth') && !GS.currentSession('admin')) return; // already on a signed-out auth screen: nothing to update, don't reload it
  render();
});
$('#app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh"><div class="skel" style="width:220px;height:34px"></div></div>`;
GSH.loader.setProbe(() => GS.ping());
GSH.loader.begin('boot');
const startApp = () => GS.boot().then(() => { render(); GSH.loader.ready(); }).catch(async e => {
  if (await GSH.loader.recover()) return startApp();   // it was a connection problem: waited for the connection, now retry
  GSH.loader.cancel();
  $('#app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center">Could not connect to the marketplace backend. ${esc(e.message || '')}</div>`;
});
startApp();

</script>
</body>
</html>
