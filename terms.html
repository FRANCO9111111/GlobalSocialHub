<style>
:root{--p50:#f6f3ff;--p100:#ede8ff;--p200:#ddd3fe;--p600:#7c3aed;--p700:#6d28d9;--p800:#5b21b6;--ink:#1b1533;--ink2:#484263;--muted:#7b7594;--line:#e9e5f5;--bg:#faf8ff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);background:linear-gradient(180deg,var(--p100) 0,var(--bg) 320px);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--p700);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in,.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.top .in{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{display:block;height:46px;width:auto}
.back{font-size:13px;font-weight:600;white-space:nowrap}
.wrap{padding-top:22px;padding-bottom:56px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--p200);background:rgba(255,255,255,.6);color:var(--p700);font:600 10.5px/1.6 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--p600);box-shadow:0 0 0 3px var(--p200)}
h1{font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:12px 0 4px}
.sub{color:var(--ink2);font-size:14px}.upd{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
p{margin:0 0 9px;font-size:14px;line-height:1.7;color:var(--ink2)}
ul,ol{margin:0 0 11px;padding-left:20px;font-size:14px;line-height:1.65;color:var(--ink2)}li{margin-bottom:3px}
h2.part{font-size:16px;margin:32px 0 2px;padding-top:14px;border-top:1px solid var(--line);color:var(--p800)}
h3{font-size:15px;margin:20px 0 6px;scroll-margin-top:70px}
h4{font-size:13.5px;margin:14px 0 4px;color:var(--ink2)}
details{margin:14px 0 6px;background:#fff;border:1px solid var(--line);border-radius:12px}
summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary svg{transition:transform .15s}details[open] summary svg{transform:rotate(180deg)}
details[open] summary{border-bottom:1px solid var(--line)}
.toc{padding:8px 14px 12px;display:flex;flex-direction:column;gap:2px}
.toc .tp{margin-top:8px;font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--p700)}
.toc a{font-size:13px;padding:3px 0;color:var(--ink2)}.toc a:hover{color:var(--p700)}
footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}
footer .wrap{padding-top:16px;padding-bottom:20px}
@media print{.top,details,footer{display:none}body{background:#fff}}
</style>
</head>

GLOBAL SOCIAL HUB

Terms & Conditions, Privacy Policy & Acceptable Use Policy

Last Updated: September 24, 2026

Welcome to Global Social Hub (“Global Social Hub,” “we,” “us,” “our,” or “the Platform”).

These Terms & Conditions, Privacy Policy, and Acceptable Use Policy (“Policies”) govern your access to and use of Global Social Hub, including our website, marketplace, accounts, listings, digital services, wallet/payment features, messaging/support systems, and any other services we provide.

By creating an account, accessing the Platform, purchasing or listing an item, depositing funds, or otherwise using Global Social Hub, you agree to these Policies.

If you do not agree with these Policies, you must not use the Platform.

---

PART 1 — TERMS & CONDITIONS

1. About Global Social Hub

Global Social Hub is a digital marketplace and platform that may allow users to list, discover, purchase, sell, or otherwise transact in digital products and services, including certain social-media-related assets and other digital items made available through the Platform.

Global Social Hub is a marketplace/platform provider. Unless explicitly stated otherwise, we are not the original owner, creator, operator, or administrator of third-party social-media platforms or services.

We do not guarantee that any third-party platform will continue to support, recognize, permit, or maintain a particular account, page, channel, username, feature, or service.

---

2. Eligibility

You must meet the minimum legal age required to enter into a binding agreement in your jurisdiction to use Global Social Hub.

By using the Platform, you confirm that:

- You are legally capable of entering into these Terms.
- The information you provide is accurate and not misleading.
- You will maintain the security of your account.
- You will comply with applicable laws and regulations.
- You will comply with these Policies.
- You will not use the Platform for unlawful or fraudulent purposes.

We may request additional information where reasonably necessary to verify an account, transaction, listing, payment, or dispute.

---

3. User Accounts

Certain features require you to create an account.

You are responsible for:

- Providing accurate registration information.
- Keeping your login credentials secure.
- Keeping your account information up to date.
- Preventing unauthorized access to your account.
- All activity carried out through your account unless caused by circumstances outside your reasonable control.

You must not:

- Share your account credentials with unauthorized persons.
- Sell, rent, or transfer your Global Social Hub account without our permission.
- Create accounts for fraudulent purposes.
- Impersonate another person or organization.
- Provide false identity or transaction information.

If you believe your account has been compromised, you should contact support immediately.

---

4. Marketplace Listings

Users may be permitted to create listings for eligible digital products or services.

Sellers are responsible for ensuring that their listings are:

- Accurate.
- Complete.
- Not misleading.
- Legally permitted.
- Consistent with these Policies.
- Supported by the seller's lawful ownership or authorization.

Sellers must not list stolen, hacked, compromised, illegally obtained, fraudulent, or unauthorized digital assets.

Listings may be reviewed, edited, restricted, rejected, or removed by Global Social Hub where we believe this is necessary to protect users, the Platform, or comply with applicable law.

---

5. Ownership and Authorization

By listing an asset on Global Social Hub, you represent and warrant that:

1. You own the asset or have sufficient authorization to sell or transfer it.
2. You have the legal right to complete the transaction.
3. The asset was not obtained through hacking, theft, phishing, fraud, unauthorized access, or other unlawful means.
4. The information provided in the listing is truthful.
5. The transaction does not knowingly violate applicable law or the rules of the relevant third-party platform.

Global Social Hub may request evidence of ownership or authorization.

Failure to provide reasonably requested evidence may result in a listing being removed, funds being held where permitted, a transaction being cancelled, or an account being restricted.

---

6. Prohibited Digital Assets

The following may not be listed, sold, purchased, transferred, or promoted through Global Social Hub:

- Hacked accounts.
- Stolen accounts.
- Compromised accounts.
- Accounts obtained through phishing.
- Accounts obtained through unauthorized access.
- Accounts containing unlawfully obtained personal information.
- Fraudulent accounts.
- Assets obtained through payment fraud or chargeback abuse.
- Assets created or obtained for unlawful purposes.
- Assets whose sale or transfer is prohibited by applicable law.
- Any other asset that Global Social Hub reasonably determines presents a serious security, legal, or fraud risk.

We may remove prohibited listings without prior notice where reasonably necessary.

---

7. Third-Party Platform Rules

Social-media accounts, pages, channels, profiles, and similar assets may be governed by the terms and policies of the relevant third-party platform.

You acknowledge that transferring or selling such an asset may be restricted or prohibited by the third-party platform.

Global Social Hub does not guarantee that a third-party platform will:

- Permit a transfer.
- Preserve an account.
- Preserve followers, subscribers, engagement, verification, monetization, or other features.
- Restore an account.
- Prevent suspension or termination.
- Maintain the same policies or functionality.

Users are responsible for understanding the applicable rules of the relevant third-party platform.

---

8. Purchases

When you purchase an item or service through Global Social Hub:

- You are responsible for reviewing the listing before purchasing.
- You should verify that the product meets your requirements.
- You should retain relevant transaction information.
- You must not intentionally exploit errors in the Platform or listing system.

A purchase may be cancelled or reversed where there is evidence of fraud, unauthorized activity, a prohibited item, technical error, or violation of these Policies.

---

9. Payments and Wallets

Global Social Hub may provide wallet or payment functionality.

Wallet balances may represent funds available for eligible transactions within the Platform and may be subject to restrictions, verification, transaction limits, or other conditions.

You must not:

- Use fraudulent payment methods.
- Use stolen payment information.
- Attempt unauthorized chargebacks.
- Manipulate payment confirmations.
- Submit false payment receipts.
- Exploit payment processing errors.
- Attempt to bypass transaction limits or security controls.

We may delay, reject, reverse, or investigate transactions where we reasonably suspect fraud, abuse, technical errors, or policy violations.

---

10. Refunds

Refund eligibility depends on the type of transaction and circumstances involved.

Where a refund is approved, Global Social Hub may return the applicable amount to the user's Platform wallet or, where available and appropriate, through the original payment method.

Refunds may be denied where:

- The buyer received the product as described.
- The buyer caused the issue through misuse.
- The buyer violated these Policies.
- The transaction involved fraudulent or suspicious activity.
- The claim is false or abusive.
- The applicable third-party service caused the issue outside Global Social Hub's control.

Specific product categories may have additional refund conditions displayed before purchase.

---

11. Seller Responsibilities

Sellers are responsible for:

- Delivering what they advertise.
- Providing accurate descriptions.
- Delivering within the stated timeframe.
- Maintaining the quality and functionality represented in the listing.
- Responding appropriately to legitimate buyer disputes.
- Ensuring that their listings comply with these Policies.

Repeated complaints, failed deliveries, misleading listings, or fraudulent activity may result in restrictions or termination.

---

12. Buyer Responsibilities

Buyers must:

- Review listings carefully before purchasing.
- Provide accurate information when required.
- Follow reasonable delivery or transfer instructions.
- Not abuse dispute or refund systems.
- Not falsely claim that a legitimate transaction was fraudulent.
- Not attempt to obtain products or services without paying for them.

False disputes, chargeback abuse, or refund fraud may result in account restrictions or termination.

---

13. Disputes Between Buyers and Sellers

If a dispute occurs, users should contact Global Social Hub support through the available support channels.

We may review:

- Transaction records.
- Listing information.
- Messages.
- Delivery information.
- Payment records.
- Relevant evidence supplied by either party.
- Other information reasonably necessary to determine what happened.

Global Social Hub may make a reasonable determination regarding a marketplace dispute.

Our decision may include:

- Approving a refund.
- Releasing funds.
- Reversing a transaction.
- Removing a listing.
- Restricting an account.
- Taking no action where evidence is insufficient.

We do not guarantee that every dispute will result in a refund.

---

14. Fees and Commissions

Global Social Hub may charge fees for certain transactions or services.

Applicable fees should be displayed before or during the relevant transaction where reasonably possible.

We may change our fees from time to time. Changes generally apply to future transactions unless otherwise stated.

---

15. Platform Availability

We aim to keep Global Social Hub available and functional, but we do not guarantee uninterrupted service.

The Platform may occasionally be unavailable because of:

- Maintenance.
- Updates.
- Security incidents.
- Hosting problems.
- Network failures.
- Third-party service failures.
